name: Проверка сервиса

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Проверка HTTP-контракта
        run: python -m unittest discover -s services/orders -p 'test_*.py' -v
      - name: Сборка Docker, запуск и проверка /health
        run: sh scripts/check.sh
