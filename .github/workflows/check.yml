name: Проверка сервиса

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '02_2_балла_Сервис'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Проверка HTTP-контракта
        run: python -m unittest -v test_app.py
      - name: Сборка Docker, запуск и проверка /health
        run: sh check.sh
