 textLength="233.137">Квалифицированный handset DLR</text><polygon points="496.413,673.922,486.413,677.922,496.413,681.922,492.413,677.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="490.413" y1="677.922" x2="994.105" y2="677.922" style="stroke:#181818;stroke-width:1;"/><text x="502.413" y="672.856" fill="#000" font-size="13" textLength="18.091" font-weight="700">14</text><text x="524.504" y="672.856" fill="#000" font-size="13" textLength="463.601">evidence; notification -> DELIVERED; отменить невыданные задания</text><polygon points="1131.553,703.055,1141.553,707.055,1131.553,711.055,1135.553,707.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="595.76" y1="707.055" x2="1137.553" y2="707.055" style="stroke:#181818;stroke-width:1;"/><text x="602.76" y="701.989" fill="#000" font-size="13" textLength="18.091" font-weight="700">15</text><text x="624.851" y="701.989" fill="#000" font-size="13" textLength="196.276">Поздний push(notification_id)</text><polygon points="1006.105,732.188,996.105,736.188,1006.105,740.188,1002.105,736.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1000.105" y1="736.188" x2="1142.553" y2="736.188" style="stroke:#181818;stroke-width:1;"/><text x="1012.105" y="731.122" fill="#000" font-size="13" textLength="18.091" font-weight="700">16</text><text x="1034.196" y="731.122" fill="#000" font-size="13" textLength="89.654">Поздний ACK</text><polygon points="496.413,776.453,486.413,780.453,496.413,784.453,492.413,780.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="490.413" y1="780.453" x2="994.105" y2="780.453" style="stroke:#181818;stroke-width:1;"/><text x="502.413" y="767.821" fill="#000" font-size="13" textLength="18.091" font-weight="700">17</text><text x="524.504" y="760.254" fill="#000" font-size="13" textLength="298.803">Дополнить evidence; не менять DELIVERED;</text><text x="524.504" y="775.387" fill="#000" font-size="13" textLength="367.44">зафиксировать наблюдаемый межканальный повтор</text><path d="M653.789,793.453 L653.789,818.453 L1203.789,818.453 L1203.789,803.453 L1193.789,793.453 L653.789,793.453" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1193.789,793.453 L1193.789,803.453 L1203.789,803.453 L1193.789,793.453" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="690.145" y="810.52" fill="#000" font-size="13" textLength="468.781">Уже отправленную SMS и поздний push атомарно отменить нельзя.</text><path d="M18.695,842.586 L18.695,897.586 L649.695,897.586 L649.695,852.586 L639.695,842.586 L18.695,842.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M639.695,842.586 L639.695,852.586 L649.695,852.586 L639.695,842.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="63.491" y="859.653" fill="#000" font-size="13" textLength="472.139">При окончательном отказе push ожидание 10 секунд пропускается.</text><text x="63.491" y="874.786" fill="#000" font-size="13" textLength="532.454">Все каналы исчерпаны: PENDING + channels_exhausted; в 60 с UNCONFIRMED.</text><text x="63.491" y="889.918" fill="#000" font-size="13" textLength="507.019">Сильный ACK отменяет невыданные отправки, включая DELIVERED_LATE.</text><?plantuml-src TLLDRzj64BthLmnyIb0xRIyzs801ML8B8uuYs6bp2I0mqhec8f44IGNkpNBQEe2320ro2f06GVu0grgHR9dKNzZz2_qbVJDBVLdsmHQvt9rvR-RDszYDMuhqEvsO4ptIYKxDAHNflvFtf5Czq9cUuCD0N-1lRFx2MchEzINfaUcQF_3vWe9ET8HtEdJSblzIXNmmeOD71mMd4_jUf_rSXON02MEtuGQE5zDQANJnuhJegH--K66qHawKFnUQJkmyTo95QxMM4n_wOPlAExAXlBCSfSPvWz1_wJPLA3juPNaFK2nlOLXBEwf-x1u2JEpw7XLhkx8Blykxz2SfpnY4lw8IAPu7fF_XUkahdTX3GL3m_5YH5C7IMI_lR9B-eljImanV8yJi-4HYfgPdJdMsHKuSgtOGstgQLvo83YhLycxrfuADHXlRmd6J8kKrxtaBqEjkStqQ0S_t2rATZOtZ70XG_8qqm87-wedEy38m9wQdK_gMOhUj_4wya8PnJm7XzUVgm-hZfzKjyjHnN7SQajA92otV3qY_rnbz_nsPBhXT0NaALN06KO8vGv