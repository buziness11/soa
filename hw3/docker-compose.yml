name: flight-booking

services:
  redis:
    image: redis:7.4-alpine

  booking-db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - booking_data:/var/lib/postgresql/data

  flight-db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight
    volumes:
      - flight_data:/var/lib/postgresql/data

  booking-migrate:
    image: redgate/flyway:11.8.2-alpine
    platform: linux/amd64
    command: -url=jdbc:postgresql://booking-db:5432/booking -user=booking -password=booking -connectRetries=10 migrate
    volumes:
      - ./migrations/booking:/flyway/sql
    depends_on: [booking-db]

  flight-migrate:
    image: redgate/flyway:11.8.2-alpine
    platform: linux/amd64
    command: -url=jdbc:postgresql://flight-db:5432/flight -user=flight -password=flight -connectRetries=10 migrate
    volumes:
      - ./migrations/flight:/flyway/sql
    depends_on: [flight-db]

  flight-service:
    build: .
    command: python flight_service.py
    environment:
      DATABASE_URL: postgresql://flight:flight@flight-db:5432/flight
      FLIGHT_API_KEY: ${FLIGHT_API_KEY}
      REDIS_URL: redis://redis:6379/0
    ports:
      - '50051:50051'
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  booking-service:
    build: .
    command: python booking_service.py
    environment:
      DATABASE_URL: postgresql://booking:booking@booking-db:5432/booking
      FLIGHT_SERVICE_ADDR: flight-service:50051
      FLIGHT_API_KEY: ${FLIGHT_API_KEY}
    ports:
      - '8080:8080'
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight-service:
        condition: service_started

volumes:
  booking_data:
  flight_data:
