syntax = "proto2";
package cinema;

enum EventType {
  VIEW_STARTED = 1;
  VIEW_FINISHED = 2;
  VIEW_PAUSED = 3;
  VIEW_RESUMED = 4;
  LIKED = 5;
  SEARCHED = 6;
}

enum DeviceType {
  MOBILE = 1;
  DESKTOP = 2;
  TV = 3;
  TABLET = 4;
}

message MovieEvent {
  required string event_id = 1;         // Canonical UUID string.
  required string user_id = 2;
  required string movie_id = 3;
  required EventType event_type = 4;
  required string timestamp = 5;        // UTC, YYYY-MM-DDTHH:mm:ss.sssZ.
  required DeviceType device_type = 6;
  required string session_id = 7;
  optional uint32 progress_seconds = 8; // Present for viewing events, including zero.
}
